service: products-backend-ecs

frameworkVersion: "3"

useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    ECR_REPO: ${env:ECR_REPO_URI}

custom:
  awsAccountId: ${aws:accountId}
  baseName: ${self:service}-${self:provider.stage}
  productsTable: Products
  productsBucket: products-ecs-${self:provider.stage}-${self:custom.awsAccountId}

resources:
  Resources:
    ECSCluster:
      Type: AWS::ECS::Cluster
      Properties:
        ClusterName: ${self:custom.baseName}-cluster
        CapacityProviders:
          - FARGATE

    ECSService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: !Ref ECSTaskDefinition
        ServiceName: ${self:custom.baseName}-service
        Cluster: !Ref ECSCluster
        LaunchType: FARGATE
        SchedulingStrategy: REPLICA
        DesiredCount: 1
        AvailabilityZoneRebalancing: ENABLED
        NetworkConfiguration:
          AwsvpcConfiguration:
            # VPCId: !Ref VPC
            Subnets:
              - !Ref Subnet1
              - !Ref Subnet2
            SecurityGroups:
              - !Ref ECSSecuiryGroup
            AssignPublicIp: ENABLED

    VPC:
      Type: AWS::EC2::VPC
      Properties:
        CidrBlock: 10.0.0.0/16
        EnableDnsSupport: true
        EnableDnsHostnames: true
        InstanceTenancy: default

    Subnet1:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref VPC
        CidrBlock: 10.0.0.0/24
        AvailabilityZone: us-east-1a

    Subnet2:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref VPC
        CidrBlock: 10.0.1.0/24
        AvailabilityZone: us-east-1b

    InternetGateway:
      Type: AWS::EC2::InternetGateway
      Properties:
        Tags:
          - Key: Name
            Value: ${self:custom.baseName}-internet-gateway

    InternetGatewayAttachment:
      Type: AWS::EC2::VPCGatewayAttachment
      Properties:
        InternetGatewayId: !Ref InternetGateway
        VpcId: !Ref VPC

    PublicRouteTable:
      Type: AWS::EC2::RouteTable
      Properties:
        VpcId: !Ref VPC
        Tags:
          - Key: Name
            Value: ${self:custom.baseName}-public-route-table

    PublicRoute:
      Type: AWS::EC2::Route
      DependsOn: InternetGatewayAttachment
      Properties:
        RouteTableId: !Ref PublicRouteTable
        DestinationCidrBlock: 0.0.0.0/0
        GatewayId: !Ref InternetGateway

    Subnet1RouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref Subnet1
        RouteTableId: !Ref PublicRouteTable

    Subnet2RouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref Subnet2
        RouteTableId: !Ref PublicRouteTable

    ECSSecuiryGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupName: ${self:custom.baseName}-security-group
        GroupDescription: ${self:custom.baseName}-security-group
        VpcId: !Ref VPC
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 3000
            ToPort: 3000
            CidrIp: 0.0.0.0/0
          - IpProtocol: tcp
            FromPort: 0
            ToPort: 65535
            CidrIp: 0.0.0.0/0
        SecurityGroupEgress:
          - IpProtocol: -1
            CidrIp: 0.0.0.0/0

    ECSTaskDefinition:
      Type: AWS::ECS::TaskDefinition
      Properties:
        Family: ${self:custom.baseName}-task
        RequiresCompatibilities:
          - FARGATE
        RuntimePlatform:
          CpuArchitecture: X86_64
          OperatingSystemFamily: LINUX
        NetworkMode: awsvpc
        Cpu: "256"
        Memory: "512"
        ExecutionRoleArn: !Ref ECSTaskExecutionRole
        TaskRoleArn: !Ref ECSTaskRole
        ContainerDefinitions:
          - Name: ${self:custom.baseName}-container
            Essential: true
            Image: ${env:ECR_REPO_URI}
            PortMappings:
              - ContainerPort: 3000
                Protocol: tcp
                AppProtocol: http
                HostPort: 3000
            Environment:
              - Name: REGION
                Value: ${self:provider.region}
              - Name: PRODUCTS_TABLE
                Value: ${self:custom.productsTable}
              - Name: PRODUCTS_BUCKET
                Value: ${self:custom.productsBucket}

    ECSTaskExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:custom.baseName}-ecsTaskExecutionRole
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: ${self:custom.baseName}-ecsTaskExecutionRolePolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - ecr:GetAuthorizationToken
                    - ecr:BatchCheckLayerAvailability
                    - ecr:GetDownloadUrlForLayer
                    - ecr:BatchGetImage
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"

    # Task Role - permissions for the running container
    ECSTaskRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:custom.baseName}-ecsTaskRole
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: ${self:custom.baseName}-dynamoDBPolicy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                    - dynamodb:Scan
                    - dynamodb:Query
                  Resource:
                    - !GetAtt ProductsTable.Arn
          - PolicyName: ${self:custom.baseName}-s3Policy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                    - s3:ListBucket
                  Resource:
                    - !GetAtt ProductsBucket.Arn
                    - !Sub "${ProductsBucket.Arn}/*"

    # DynamoDB Table for Products
    ProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.productsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: type
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        Tags:
          - Key: Name
            Value: ${self:custom.baseName}-products-table
        GlobalSecondaryIndexes:
          - IndexName: ProductsByTypeIndex
            KeySchema:
              - AttributeName: type
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    # S3 Bucket for Product Images and Brochures
    ProductsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.productsBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - "*"
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
              AllowedOrigins:
                - "*"
              MaxAge: 3600
        Tags:
          - Key: Name
            Value: ${self:custom.baseName}-products-bucket

    # S3 Bucket Policy for public read access (for product images)
    ProductsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ProductsBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource: !Sub "${ProductsBucket.Arn}/*"

  Outputs:
    ProductsTableName:
      Description: DynamoDB Products Table Name
      Value: !Ref ProductsTable
      Export:
        Name: ${self:custom.baseName}-ProductsTableName

    ProductsTableArn:
      Description: DynamoDB Products Table ARN
      Value: !GetAtt ProductsTable.Arn
      Export:
        Name: ${self:custom.baseName}-ProductsTableArn

    ProductsBucketName:
      Description: S3 Products Bucket Name
      Value: !Ref ProductsBucket
      Export:
        Name: ${self:custom.baseName}-ProductsBucketName

    ProductsBucketArn:
      Description: S3 Products Bucket ARN
      Value: !GetAtt ProductsBucket.Arn
      Export:
        Name: ${self:custom.baseName}-ProductsBucketArn
